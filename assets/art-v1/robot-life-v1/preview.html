<body><main><div class="muted">素材审阅 · 480×480场景比例 · 本页不连接设备</div><h1>园丁的两种自主生活</h1><p>看窗外采用侧后方观看姿态；检查植物采用空夹爪、低头和屏内扫描。每组4帧，统一160×176画布，与原悬浮动作对照大小。</p>
