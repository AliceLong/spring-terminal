<body><main><div class="muted">素材审阅 · 480×480场景比例 · 本页不连接设备</div><h1>照顾、收获与树下的小憩</h1><p>本次新增4组共16帧：照顾与收获分开、朝左检查植物、树下休息。同时保留上一批看窗外和朝右检查，方便比较。所有素材为透明底160×176；当前仅本地预览。</p>
